<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} — {% endif %}brianb.xyz</title>
    <link rel="stylesheet" href="/stylesheet.css">
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
    <style>
      main { max-width: 680px; }
      main p, main li { line-height: 1.65; }
      main a { color: #7cc4ff; }
      .post-date { color: rgba(240,248,255,.5); font-size: .9rem; }
      .blog-list { list-style: none; padding: 0; }
      .blog-list li { margin: 0 0 1.1rem 0; }
      .blog-list a { font-size: 1.1rem; font-weight: 600; text-decoration: none; }
      .blog-list a:hover { text-decoration: underline; }
      nav a { color: rgba(240,248,255,.65); text-decoration: none; }
      nav a:hover { color: aliceblue; }
      /* Newsreader for long-form post body; headings/UI stay Inter */
      article { font-family: "Newsreader", Georgia, serif; font-size: 1.22rem; }
      article p, article li { line-height: 1.7; }
      article h3 { font-family: Inter, sans-serif; letter-spacing: -0.02em; }
      article .post-date { font-family: Inter, sans-serif; }
    </style>
    {% feed_meta %}
</head>
<body>
    <nav><a href="/">← brianb.xyz</a>{% unless page.url == "/blog/" %} &nbsp;·&nbsp; <a href="/blog/">Blog</a>{% endunless %}</nav>
    <main>
{{ content }}
    </main>
</body>
</html>
